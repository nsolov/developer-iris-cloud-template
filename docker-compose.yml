services:
  iris:
    build:
      context: .
      args:
        IRIS_IMAGE: ${IRIS_IMAGE:-intersystemsdc/iris-community:2025.3}
    command: --check-caps false --ISCAgent false
    environment:
      APP_MESSAGE: ${APP_MESSAGE:-Hello from Docker Compose}
    ports:
      - "52773:52773"
      - "1972:1972"

